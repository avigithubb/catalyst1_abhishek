services:
  # 1. Backend API Service
  - type: web
    name: elderly-care-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter api build
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.mailtrap.io
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_USER
        value: demo_user
      - key: SMTP_PASS
        value: demo_pass
      - key: EMAIL_FROM
        value: "Elderly Care Alerts <alerts@elderlycare.local>"

  # 2. Frontend React Client (Static Site)
  - type: web
    name: elderly-care-web
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: elderly-care-api
          property: host
